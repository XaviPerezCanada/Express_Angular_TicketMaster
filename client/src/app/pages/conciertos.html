<div *ngIf="loading">Cargando conciertos...</div>
<div *ngIf="error">{{ error }}</div>

<ul *ngIf="!loading && concerts.length > 0">
  <li *ngFor="let concert of concerts">
    <strong>{{ concert.nombre }}</strong>  
    ({{ concert.artista }}) - {{ concert.fecha | date }} en {{ concert.lugar }}  
    <button (click)="deleteConcert(concert._id!)">Eliminar</button>
  </li>
</ul>

<div *ngIf="!loading && concerts.length === 0">
  No hay conciertos disponibles.
</div>
