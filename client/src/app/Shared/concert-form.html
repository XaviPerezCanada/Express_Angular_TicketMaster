<h2>{{ isEdit ? 'Editar Concierto' : 'Nuevo Concierto' }}</h2>
<form (ngSubmit)="saveConcert()">
  <label>Título:</label>
  <input [(ngModel)]="concert.title" name="title" required>
  <br>
  <label>Fecha:</label>
  <input type="date" [(ngModel)]="concert.date" name="date" required>
  <br>
  <label>Lugar:</label>
  <input [(ngModel)]="concert.venue" name="venue" required>
  <br>
  <button type="submit">{{ isEdit ? 'Actualizar' : 'Crear' }}</button>
</form>
