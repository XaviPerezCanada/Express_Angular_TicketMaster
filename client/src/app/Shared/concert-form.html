<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 p-6 bg-white shadow rounded-lg max-w-lg mx-auto">
  <h2 class="text-xl font-bold text-center">
    {{ concertId ? "Editar Concierto" : "Crear Concierto" }}
  </h2>

  <div>
    <label class="block font-medium">Nombre</label>
    <input type="text" formControlName="nombre" class="w-full p-2 border rounded" />
    <div *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid" class="text-red-500 text-sm">
      El nombre es obligatorio
    </div>
  </div>

  <div>
    <label class="block font-medium">Artista</label>
    <input type="text" formControlName="artista" class="w-full p-2 border rounded" />
    <div *ngIf="form.get('artista')?.touched && form.get('artista')?.invalid" class="text-red-500 text-sm">
      El artista es obligatorio
    </div>
  </div>

  <div>
    <label class="block font-medium">Fecha</label>
    <input type="date" formControlName="fecha" class="w-full p-2 border rounded" />
    <div *ngIf="form.get('fecha')?.touched && form.get('fecha')?.invalid" class="text-red-500 text-sm">
      La fecha es obligatoria
    </div>
  </div>

  <div>
    <label class="block font-medium">Lugar</label>
    <input type="text" formControlName="lugar" class="w-full p-2 border rounded" />
    <div *ngIf="form.get('lugar')?.touched && form.get('lugar')?.invalid" class="text-red-500 text-sm">
      El lugar es obligatorio
    </div>
  </div>

  <div>
    <label class="block font-medium">Precio</label>
    <input type="number" formControlName="precio" class="w-full p-2 border rounded" />
    <div *ngIf="form.get('precio')?.touched && form.get('precio')?.invalid" class="text-red-500 text-sm">
      <span *ngIf="form.get('precio')?.errors?.['required']">El precio es obligatorio</span>
      <span *ngIf="form.get('precio')?.errors?.['min']">El precio no puede ser negativo</span>
    </div>
  </div>

  <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition">
    {{ concertId ? "Actualizar" : "Crear" }}
  </button>
</form>
